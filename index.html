/* =========================================
   小U助手 2.0：桌面端固定布局
========================================= */

@media (min-width: 821px) {

  /* 整个浏览器页面固定 */
  html,
  body {
    height: 100%;
    overflow: hidden;
  }

  .app {
    height: 100vh;
    min-height: 0;
    overflow: hidden;
  }

  /* 左侧导航 */
  .sidebar {
    height: 100%;
    min-height: 0;
    overflow-y: auto;
  }

  /* 右侧主工作区 */
  .main {
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    flex: 0 0 62px;
    position: relative;
    z-index: 5;
  }

  /* 主内容区域 */
  .main-content:has(.assistant) {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 1480px;
    margin: 0 auto;
    padding: 18px 30px 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .main-content:has(.assistant) .page-head {
    flex-shrink: 0;
    margin-bottom: 15px;
  }

  /* 左侧助手 + 右侧任务进度 */
  .workspace {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 260px;
    gap: 18px;
    align-items: stretch;
  }

  /* 助手卡片 */
  .assistant {
    min-width: 0;
    min-height: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .assistant-head {
    flex: 0 0 auto;
    min-height: 66px;
  }

  /* 中间聊天区域独立滚动 */
  .chat {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 22px;
    scrollbar-width: thin;
    scrollbar-color: #dcd8ce transparent;
  }

  .chat::-webkit-scrollbar {
    width: 6px;
  }

  .chat::-webkit-scrollbar-thumb {
    background: #dedbd3;
    border-radius: 10px;
  }

  /* 底部输入区：始终固定在助手卡片内 */
  .chat-footer {
    position: relative;
    z-index: 3;
    flex: 0 0 auto;
    padding: 16px 20px 18px;
    background: #fff;
    border-top: 1px solid var(--line);
  }

  /* 输入框加大 */
  .chat-compose {
    min-height: 66px;
    margin: 0;
    padding: 10px 12px;
    gap: 12px;
    border: 1px solid #e5e1d8;
    border-radius: 12px;
    background: #fff;
    transition: border-color .2s, box-shadow .2s;
  }

  .chat-compose:focus-within {
    border-color: #dfb35f;
    box-shadow: 0 0 0 3px rgba(230,166,56,.10);
  }

  .chat-compose input {
    flex: 1;
    min-width: 0;
    min-height: 42px;
    padding: 10px 12px;
    font-size: 14px;
  }

  .chat-compose .btn {
    min-width: 68px;
    min-height: 42px;
    padding: 10px 16px;
  }

  /* 快捷建议 */
  .suggestions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 10px 0 0 2px;
  }

  .suggestions button {
    padding: 7px 12px;
    font-size: 11px;
    border-radius: 20px;
  }

  /* 右侧任务进度栏 */
  .progress-panel {
    height: 100%;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #dedbd3 transparent;
  }
}

/* 小屏幕保留原有响应式布局 */
@media (max-width: 820px) {
  html,
  body {
    height: auto;
    overflow: auto;
  }

  .app {
    height: auto;
    min-height: 100vh;
    overflow: visible;
  }

  .main {
    height: auto;
    overflow: visible;
  }

  .main-content {
    overflow: visible;
  }

  .assistant {
    height: auto;
    overflow: visible;
  }

  .chat {
    min-height: 0;
    overflow: visible;
  }

  .chat-footer {
    position: relative;
    padding: 14px;
    background: #fff;
    border-top: 1px solid var(--line);
  }
}

      function questionCard(q,i){const editing=state.editing===i;return `<article class="question-card"><div class="question-head"><div class="question-labels"><span class="chip">${esc(q.type)}</span><span class="chip muted">${q.required?'必答':'选答'}</span><span class="chip muted">第 ${i+1} 题</span></div><button class="btn quiet" data-action="toggle-required" data-index="${i}">${q.required?'设为选答':'设为必答'}</button></div>${editing?`<textarea class="edit-area" data-edit-text="${i}">${esc(q.text)}</textarea>${q.options.length?`<textarea class="edit-area" data-edit-options="${i}" style="margin-top:7px;min-height:58px" placeholder="每行一个选项">${esc(q.options.join('\n'))}</textarea>`:''}<div class="question-foot"><small>修改后保存</small><div class="actions"><button class="btn" data-action="cancel-edit" data-index="${i}">取消</button><button class="btn primary" data-action="save-edit" data-index="${i}">保存</button></div></div>`:`<div class="question-title">${esc(q.text)}</div>${q.options.length?`<div class="options">${q.options.map(o=>`<div class="option"><span>○</span>${esc(o)}</div>`).join('')}</div>`:`<div class="option" style="color:#899197">开放文本回答</div>`}<div class="question-foot"><small>来源依据：${esc(q.source)}</small><div class="actions"><button class="btn" data-action="edit-question" data-index="${i}">编辑</button><button class="btn" data-action="regenerate-one" data-index="${i}">重生成</button><button class="btn danger" data-action="delete-question" data-index="${i}">删除</button></div></div>`}</article>`}
      function surveysPage(){return `${baseHeader('问卷管理','查看草稿与模拟发布任务。所有页面中的答卷数字均为构造演示数据。',`<button class="btn primary" data-action="new-survey">＋ 创建问卷</button>`)}<section class="surface" style="padding:16px"><div class="table-wrap"><table class="data-table"><thead><tr><th>问卷名称</th><th>调研模块</th><th>目标团队</th><th>题目</th><th>状态</th><th>最近更新</th><th>操作</th></tr></thead><tbody><tr><td>脚本生成使用体验调研</td><td>抖音脚本生成</td><td>内容创作与策划</td><td>${state.questions.length||6} 道</td><td><span class="status ${state.published?'published':'draft'}">${state.published?'已发布':'草稿'}</span></td><td>刚刚</td><td><button class="btn" data-action="continue-survey">${state.questions.length?'继续编辑':'打开草稿'}</button> <button class="btn" data-action="go-analytics">分析</button></td></tr><tr><td>评论分析功能回访问卷</td><td>评论获取及分析</td><td>达人与账号运营</td><td>—</td><td><span class="status">示例草稿</span></td><td>演示数据</td><td><button class="btn" data-action="toast-coming">查看</button></td></tr></tbody></table></div></section><div class="privacy-banner" style="margin-top:13px">原型不连接真实飞书；如需公开展示，答卷和发布数据均使用构造数据。</div>`}
      function analyticsPage(){const teams=[['内容创作与策划',14],['短视频剪辑与后期',9],['达人与账号运营',8],['视觉设计',3],['直播运营',6]];const topics=[['脚本开头吸引力',12],['人设表达一致性',9],['生成后修改路径',7],['平台表达差异',5]];return `${baseHeader('问卷数据分析','按团队、岗位和产品模块查看匿名反馈主题。',`<span class="badge">构造演示数据</span><button class="btn" data-action="export-summary">导出分析摘要</button>`)}<div class="privacy-banner">本页为交互演示，所有答卷数和主题分布均为构造数据；小于 5 份答卷的细分分组会隐藏。</div><div class="analytics-top"><div class="metric"><span>构造答卷</span><strong>42 份</strong><small>抖音脚本生成体验调研</small></div><div class="metric"><span>匿名分组</span><strong>4 类</strong><small>按功能团队统计</small></div><div class="metric"><span>可见主题</span><strong>4 项</strong><small>来源：开放题示例回答</small></div><div class="metric"><span>隐去小样本</span><strong>1 组</strong><small>低于展示门槛</small></div></div><div class="analytics-grid"><section class="chart-panel"><h3>按功能团队查看答卷</h3><p>少于 5 份的分组不展示具体数量</p><div class="bar-list">${teams.map((t,i)=>`<div class="bar-row"><span>${t[0]}</span><div class="bar-track"><div class="bar-fill ${i%2?'green':''}" style="width:${t[1]/14*100}%"></div></div><strong>${t[1]>=5?t[1]+' 份':'已隐藏'}</strong></div>`).join('')}</div></section><section class="chart-panel"><h3>开放题高频主题</h3><p>基于构造回答归纳，可回看题目与样例记录</p>${topics.map((t,i)=>`<div class="topic-row"><span>${t[0]}</span><strong>${t[1]} 条示例提及</strong></div>`).join('')}</section></div><section class="insight"><h3>AI 初步归纳 · 待运营复核</h3><p>演示样本中，“脚本开头吸引力”和“人设表达一致性”是出现较多的回答主题。可进一步确认用户在配置输入、生成结果还是后续修改阶段遇到阻碍，再决定是否补充问卷或进入需求评审。上述主题来自构造数据，不代表真实用户结论。</p></section><section class="surface" style="padding:16px;margin-top:14px"><div class="section-head"><div><h2>分析依据</h2><p>匿名答卷不展示身份信息</p></div><span class="badge green">复核后再转需求</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>主题</th><th>关联问题</th><th>示例数</th><th>建议跟进</th></tr></thead><tbody>${topics.slice(0,3).map((t,i)=>`<tr><td>${t[0]}</td><td>开放题 ${i+1}</td><td>${t[1]}（演示）</td><td>${['补充生成输入提示','验证人设字段效果','梳理生成后修改路径'][i]}</td></tr>`).join('')}</tbody></table></div></section>`}
      function knowledgePage(){const modules=[['脚本生成/改写','输入主题、人设、语言风格或脚本文件，生成或改写短视频脚本。'],['视频拆解','分析视频语音、字幕和画面，输出脚本结构供运营参考。'],['评论获取及分析','按达人主页或关键词获取评论并分析。'],['账号数据获取','读取达人主页相关数据并支持导出。'],['海报与图像工具','支持模板海报、图像生成、抠图与目标消除。'],['知识库问答','基于已添加资料检索并回答问题。']];return `${baseHeader('产品知识库','问卷生成引用的功能背景。演示内容依据小U功能说明整理。',`<span class="badge green">6 个模块摘要</span>`)}<div class="privacy-banner">公开演示仅展示经整理的功能摘要；内部资料原件不随页面发布。</div><section class="surface" style="padding:16px"><div class="question-list">${modules.map((m,i)=>`<article class="question-card"><div class="question-head"><div class="question-labels"><span class="chip">功能模块</span><span class="chip muted">引用 ${String(i+1).padStart(2,'0')}</span></div><span class="status published">可用于调研</span></div><div class="question-title">${m[0]}</div><div style="font-size:11px;line-height:1.6;color:#68757b">${m[1]}</div></article>`).join('')}</div><div class="source-cite">功能摘要来自小U AI工具台操作手册的归纳整理；上线前需确认对外展示范围。</div></section>`}
      function phaseBPage(){const channels=[['线上问卷','手动粘贴 / 表格导入'],['一对一沟通','手动记录纪要'],['公司群聊','企业渠道接入'],['AI 答疑助手','企业渠道接入'],['产品内反馈','手动导入'],['测试记录','表格导入']];return `${baseHeader('多渠道反馈台账','阶段 B 页面：先支持手动粘贴和表格导入；企业渠道只展示模拟接入状态（数据已脱敏）。',`<span class="badge">阶段 B</span>`)}<div class="privacy-banner">当前阶段先完成问卷闭环。此处仅展示后续导入入口，不读取公司消息、不接收真实用户反馈。</div><section class="surface" style="padding:17px"><div class="section-head"><div><h2>计划接入的反馈来源</h2><p>按反馈来源记录场景、模块、团队/岗位和处理状态</p></div><button class="btn" data-action="mock-connect">查看数据接入提示</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>来源</th><th>原型方式</th><th>当前状态</th></tr></thead><tbody>${channels.map((c,i)=>`<tr><td>${c[0]}</td><td>${c[1]}</td><td><span class="status">${i===0||i===1||i===4||i===5?'规划支持':'已脱敏'}</span></td></tr>`).join('')}</tbody></table></div><div class="phase-preview" style="margin-top:14px"><strong>连接说明</strong><button class="btn" data-action="mock-connect" style="margin-top:8px">接入企业群聊 / AI 答疑</button></div></section>`}
      function render(){el('#breadcrumb').textContent=pageNames[state.page]||'问卷助手';els('.nav button').forEach(b=>{const active=b.dataset.page===state.page;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const pages={assistant:assistantPage,surveys:surveysPage,analytics:analyticsPage,knowledge:knowledgePage,phaseB:phaseBPage};el('#mainContent').innerHTML=(pages[state.page]||assistantPage)();}
      function templateQuestions(){const mod=state.feature;return [
        {type:'单选题',text:`你最近一个月使用「${mod}」的频率是？`,options:['每周 4 次及以上','每周 1–3 次','每月 1–3 次','最近没有使用'],required:true,source:'调研目标 · 使用频率'},
        {type:'多选题',text:`你使用「${mod}」时，最希望它帮你完成哪些事情？（可多选）`,options:['快速形成内容结构','贴合账号/达人表达风格','减少重复修改','获得新的创作灵感','其他'],required:true,source:'调研目标 · 用户任务'},
        {type:'评分题',text:'请为最近一次生成结果的整体可用性打分（1 分表示很难使用，5 分表示很容易使用）。',options:[],required:true,source:'调研目标 · 体验评价'},
        {type:'单选题',text:'最近一次使用后，你对生成内容通常还需要进行多少调整？',options:['无需调整或只改少量细节','需要修改部分段落','需要大幅重写','不适用/没有使用'],required:true,source:'调研目标 · 修改成本'},
        {type:'开放题',text:'最近一次使用中，哪个环节最顺畅或最需要改进？请描述具体场景。',options:[],required:false,source:'调研目标 · 开放反馈'},
        {type:'开放题',text:'如果小U下一次只优化一件事，你最希望优化什么？',options:[],required:false,source:'调研目标 · 优先改进'}
      ].slice(0,Math.max(3,Math.min(12,Number(state.length)||6))).map(q=>({...q}));}
      function readConfig(){state.objective=el('#objective')?.value.trim()||state.objective;state.feature=el('#feature')?.value||state.feature;state.team=el('#team')?.value||state.team;state.role=el('#role')?.value||state.role;state.length=Math.max(3,Math.min(12,Number(el('#qcount')?.value)||6));state.openRatio=el('#ratio')?.value||state.openRatio;state.note=el('#note')?.value||'';state.types=els('[data-type]').filter(x=>x.checked).map(x=>x.dataset.type)}
      function openModal(kind){state.modal=kind;let content='';if(kind==='publish')content=`<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="eyebrow">模拟对接 · 企业飞书</div><h2 id="modalTitle">问卷发布预览</h2><p>以下链接和通知仅供交互演示，不会真实创建飞书表单或发送消息。</p><div class="field"><label>演示答题链接</label><input readonly value="https://feishu.example/s/xiaou-demo-2026"></div><div class="field"><label>通知预览</label><textarea readonly>【小U功能体验调研】邀请你匿名填写「${esc(state.feature)}」使用体验问卷。预计 3 分钟完成，仅按团队/岗位汇总。https://feishu.example/s/xiaou-demo-2026</textarea></div><div class="notice">问卷已模拟对接企业飞书，并生成答题链接与通知。正式环境需接入企业认证与消息推送接口。</div><div class="modal-actions"><button class="btn" data-action="copy-demo">复制演示链接</button><button class="btn primary" data-action="confirm-publish">完成发布</button></div></section></div>`;el('#modalRoot').innerHTML=content;}
      function closeModal(){state.modal=null;el('#modalRoot').innerHTML=''}
      function clickAction(action,index){switch(action){case'generate':readConfig();state.questions=templateQuestions();state.stage='review';state.confirmed=false;render();break;case'back-config':state.stage='config';render();break;case'to-preview':state.stage='preview';state.confirmed=true;render();break;case'to-review':state.stage='review';render();break;case'simulate-publish':openModal('publish');break;case'confirm-publish':state.published=true;state.stage='published';closeModal();render();toast('模拟发布完成 · 未连接真实飞书');break;case'copy-demo':{const link='https://feishu.example/s/xiaou-demo-2026';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(link).then(()=>toast('演示链接已复制')).catch(()=>toast('演示链接：'+link));else toast('演示链接：'+link);break}case'open-publish':openModal('publish');break;case'go-analytics':state.page='analytics';render();break;case'new-survey':state.page='assistant';state.stage='config';state.questions=[];state.published=false;render();break;case'continue-survey':state.page='assistant';state.stage=state.questions.length?'review':'config';render();break;case'add-question':state.questions.push({type:'开放题',text:'请补充你希望小U改进的方面。',options:[],required:false,source:'发起人添加'});render();break;case'edit-question':state.editing=index;render();break;case'cancel-edit':state.editing=null;render();break;case'save-edit':{const t=el(`[data-edit-text="${index}"]`)?.value.trim();if(t)state.questions[index].text=t;const o=el(`[data-edit-options="${index}"]`);if(o)state.questions[index].options=o.value.split('\n').map(x=>x.trim()).filter(Boolean);state.editing=null;render();toast('题目已保存');break}case'delete-question':state.questions.splice(index,1);render();toast('题目已删除');break;case'toggle-required':state.questions[index].required=!state.questions[index].required;render();break;case'regenerate-one':{const q=state.questions[index];q.text=q.type==='开放题'?'请描述最近一次使用时遇到的困难或希望改进的地方。':`在「${state.feature}」的使用过程中，哪方面最值得优先优化？`;q.source='重新生成 · 调研目标';render();toast('已生成新的题目表达');break}case'regenerate':state.questions=templateQuestions();render();toast('候选题目已重新生成');break;case'export-summary':exportSummary();break;case'mock-connect':openConnectModal();break;case'close-modal':closeModal();break;case'send-note':sendNote();break;case'toast-coming':toast('该问卷为列表演示项');break}}
      function openConnectModal(){el('#modalRoot').innerHTML=`<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="connectTitle"><div class="eyebrow">阶段 B · 渠道接入</div><h2 id="connectTitle">模拟企业渠道连接</h2><p>原型只展示连接后的状态，不读取公司群聊或答疑系统的数据。</p><div class="notice">正式环境需接入企业认证与消息推送接口。</div><div class="modal-actions"><button class="btn" data-action="close-modal">关闭</button><button class="btn primary" data-action="close-modal">知道了</button></div></section></div>`}
      function sendNote(){const inp=el('#chatInput');if(!inp||!inp.value.trim())return;state.note=(state.note?state.note+' ':'')+inp.value.trim();inp.value='';render();toast('调研要求已加入配置')}
      function exportSummary(){const text=`小U问卷分析摘要（构造演示数据）\n调研模块：${state.feature}\n目标团队：${state.team}\n目标岗位：${state.role}\n构造答卷：42 份\n高频示例主题：脚本开头吸引力、人设表达一致性、生成后修改路径\n说明：本摘要为交互原型使用的构造数据，不代表真实用户结论。`;const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='小U问卷分析摘要-构造演示.txt';a.click();URL.revokeObjectURL(a.href);toast('摘要已导出')}
      document.addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop')){closeModal();return}const nav=e.target.closest('[data-page]');if(nav){state.page=nav.dataset.page;render();return}const suggest=e.target.closest('[data-suggestion]');if(suggest){const inp=el('#note');if(inp){inp.value=(inp.value?inp.value+' ':'')+suggest.dataset.suggestion;state.note=inp.value}toast('要求已加入配置');return}const btn=e.target.closest('[data-action]');if(btn)clickAction(btn.dataset.action,Number(btn.dataset.index));});
      document.addEventListener('change',e=>{if(e.target.id==='feature')state.feature=e.target.value;if(e.target.id==='team')state.team=e.target.value;if(e.target.id==='role')state.role=e.target.value;if(e.target.id==='ratio')state.openRatio=e.target.value});
      document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatInput'){e.preventDefault();sendNote()}if(e.key==='Escape')closeModal()});
      render();
    })();
  </script>
</body>
</html>
