/* =========================================
   小U助手 2.0：桌面端固定布局
========================================= */

@media (min-width: 821px) {

  /* 整个浏览器页面固定 */
  html,
  body {
    height: 100%;
    overflow: hidden;
  }

  .app {
    height: 100vh;
    min-height: 0;
    overflow: hidden;
  }

  /* 左侧导航 */
  .sidebar {
    height: 100%;
    min-height: 0;
    overflow-y: auto;
  }

  /* 右侧主工作区 */
  .main {
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    flex: 0 0 62px;
    position: relative;
    z-index: 5;
  }

  /* 主内容区域 */
  .main-content:has(.assistant) {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 1480px;
    margin: 0 auto;
    padding: 18px 30px 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .main-content:has(.assistant) .page-head {
    flex-shrink: 0;
    margin-bottom: 15px;
  }

  /* 左侧助手 + 右侧任务进度 */
  .workspace {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 260px;
    gap: 18px;
    align-items: stretch;
  }

  /* 助手卡片 */
  .assistant {
    min-width: 0;
    min-height: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .assistant-head {
    flex: 0 0 auto;
    min-height: 66px;
  }

  /* 中间聊天区域独立滚动 */
  .chat {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 22px;
    scrollbar-width: thin;
    scrollbar-color: #dcd8ce transparent;
  }

  .chat::-webkit-scrollbar {
    width: 6px;
  }

  .chat::-webkit-scrollbar-thumb {
    background: #dedbd3;
    border-radius: 10px;
  }

  /* 底部输入区：始终固定在助手卡片内 */
  .chat-footer {
    position: relative;
    z-index: 3;
    flex: 0 0 auto;
    padding: 16px 20px 18px;
    background: #fff;
    border-top: 1px solid var(--line);
  }

  /* 输入框加大 */
  .chat-compose {
    min-height: 66px;
    margin: 0;
    padding: 10px 12px;
    gap: 12px;
    border: 1px solid #e5e1d8;
    border-radius: 12px;
    background: #fff;
    transition: border-color .2s, box-shadow .2s;
  }

  .chat-compose:focus-within {
    border-color: #dfb35f;
    box-shadow: 0 0 0 3px rgba(230,166,56,.10);
  }

  .chat-compose input {
    flex: 1;
    min-width: 0;
    min-height: 42px;
    padding: 10px 12px;
    font-size: 14px;
  }

  .chat-compose .btn {
    min-width: 68px;
    min-height: 42px;
    padding: 10px 16px;
  }

  /* 快捷建议 */
  .suggestions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 10px 0 0 2px;
  }

  .suggestions button {
    padding: 7px 12px;
    font-size: 11px;
    border-radius: 20px;
  }

  /* 右侧任务进度栏 */
  .progress-panel {
    height: 100%;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #dedbd3 transparent;
  }
}

/* 小屏幕保留原有响应式布局 */
@media (max-width: 820px) {
  html,
  body {
    height: auto;
    overflow: auto;
  }

  .app {
    height: auto;
    min-height: 100vh;
    overflow: visible;
  }

  .main {
    height: auto;
    overflow: visible;
  }

  .main-content {
    overflow: visible;
  }

  .assistant {
    height: auto;
    overflow: visible;
  }

  .chat {
    min-height: 0;
    overflow: visible;
  }

  .chat-footer {
    position: relative;
    padding: 14px;
    background: #fff;
    border-top: 1px solid var(--line);
  }
}


/* ===== 知识库管理===== */
.kb-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kb-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kb-stat span{font-size:11px;color:#7e8a8f}.kb-stat strong{display:block;font-size:26px;margin:8px 0 4px;color:#263940;font-weight:650}.kb-stat small{font-size:10px;color:#7b888c}.kb-stat small.ok{color:var(--teal);font-weight:600}
.kb-main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.kb-doc{display:flex;gap:10px;padding:12px;border-radius:10px;border:1px solid transparent;cursor:pointer;margin-bottom:6px}
.kb-doc:hover{background:#faf8f2}.kb-doc.on{background:#fff4dd;border-color:#ecd7a8}
.kb-ico{width:38px;height:38px;flex:none;border-radius:9px;background:#f2efe6;display:grid;place-items:center;font-size:11px;color:#6b6252}
.kb-doc b{display:block;font-size:12px;word-break:break-all}.kb-doc small{font-size:10px;color:#89939a;line-height:1.6}
.kb-tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:14px 0}
.kb-tab{padding:9px 0;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-size:12px}.kb-tab.on{color:#a2752d;border-color:var(--gold);font-weight:600}
.kb-raw{white-space:pre-wrap;line-height:1.8;border:1px solid var(--line);border-radius:10px;padding:14px;background:#fffefa;max-height:46vh;overflow:auto;font-size:12px;color:#36444b}
.kb-slice{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;font-size:12px;line-height:1.7;white-space:pre-wrap}
.kb-slice b{color:#8d672e;margin-right:8px}.kb-slice small{color:#9aa3a8;margin-left:6px}
.kb-meta{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px 12px;font-size:12px;align-items:center;max-width:520px}
.kb-meta label{color:var(--muted)}.kb-meta input{border:1px solid #dedbd3;border-radius:8px;padding:8px 10px;font-size:12px;width:100%}
.kb-meta .ro{color:#35434a}
/* 元数据页（仿 HR 页） */
.kb-form{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}.kb-form input[readonly]{background:#faf8f2;color:#6b7a86}
.kb-tags{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}.kb-tags h3{font-size:14px;margin:0 0 12px}
.kb-chip{display:inline-block;border-radius:6px;padding:5px 10px;margin:0 8px 8px 0;font-size:11px;background:#eeece5;color:#5a6468}.kb-chip.g{background:#fff0cf;color:#8d672e}.kb-chip.t{background:#e0f2ec;color:#2f7a68}
.kb-tags p{font-size:11px;color:#7e8a8f;line-height:1.7;margin:6px 0 0}
@media(max-width:820px){.kb-form{grid-template-columns:1fr}}
@media(max-width:820px){.kb-stats{grid-template-columns:1fr 1fr}.kb-main{grid-template-columns:1fr}}
/* 可选：桌面端非助手页面也能滚动（若下半截看不到就保留） */
@media(min-width:821px){.main-content:not(:has(.assistant)){flex:1;min-height:0;width:100%;overflow-y:auto}}

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand"><div class="brand-mark">小U</div><div><div class="brand-name">小U反馈洞察</div><div class="brand-sub">PRODUCT OPS WORKSPACE</div></div></div>
      <div class="nav-label">工作空间</div>
      <nav class="nav">
        <button class="active" data-page="assistant" aria-current="page"><span class="nav-icon">✦</span><span class="nav-text">问卷助手</span></button>
        <button data-page="surveys"><span class="nav-icon">▤</span><span class="nav-text">问卷管理</span></button>
        <button data-page="analytics"><span class="nav-icon">▥</span><span class="nav-text">数据分析</span></button>
        <button data-page="knowledge"><span class="nav-icon">▧</span><span class="nav-text">产品知识库</span></button>
      </nav>
      <div class="nav-label">下一阶段</div>
      <nav class="nav">
        <button data-page="phaseB"><span class="nav-icon">◫</span><span class="nav-text">反馈台账</span></button>
        <button data-page="phaseB"><span class="nav-icon">◉</span><span class="nav-text">需求池</span></button>
      </nav>
      <div class="side-bottom">原型演示空间<br>构造数据 · 不连接企业系统<div class="profile"><div class="avatar">运</div><div>产品运营<br>演示账号</div></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="crumb">工作台　/　<strong id="breadcrumb">问卷助手</strong></div><div class="top-right"><span class="live"><i class="dot"></i>原型运行中</span><span class="date">2026/11/11</span></div></header>
      <div class="main-content" id="mainContent"></div>
    </main>
  </div>
  <div id="modalRoot"></div><div id="toastRoot" aria-live="polite"></div>
  <script>
    (()=>{
      const featureOptions=['抖音脚本生成','抖音视频拆解','小红书脚本生成','小红书视频拆解','评论获取及分析','账号数据获取','模版海报生成','小U同学知识库','其他功能'];
      const teamOptions=['内容创作与策划','短视频剪辑与后期','视觉设计','达人与账号运营','直播运营','商务与商业化','数据运营','产品运营','内容安全与版权合规','其他团队'];
      const roleOptions=['剧情编导','口播编导','探店编导','健身编导','母婴编导','美妆编导','短视频剪辑','后期包装','视觉设计','达人运营','直播运营','产品运营','数据分析','其他岗位'];
      const state={page:'assistant',stage:'config',feature:featureOptions[0],team:teamOptions[0],role:roleOptions[1],objective:'了解小U脚本生成的使用体验与内容优化方向',length:6,openRatio:'2 道开放题',types:['单选题','多选题','评分题','开放题'],note:'重点了解脚本结构、达人/账号人设表达、生成后修改过程。题目保持中立，控制在 5 分钟内。',questions:[],editing:null,confirmed:false,published:false,modal:null};
      const icons={assistant:'✦',surveys:'▤',analytics:'▥',knowledge:'▧',phaseB:'◫'};
      const pageNames={assistant:'问卷助手',surveys:'问卷管理',analytics:'数据分析',knowledge:'产品知识库',phaseB:'阶段 B · 反馈台账'};
      const el=(s,root=document)=>root.querySelector(s), els=(s,root=document)=>[...root.querySelectorAll(s)];
      const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const toast=msg=>{const r=el('#toastRoot');r.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>r.innerHTML='',2700)};
      const optionList=(items,selected)=>items.map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join('');
      const progress=()=>({config:0,review:45,preview:70,published:100}[state.stage]??0);
      const stepIndex=()=>({config:0,review:1,preview:2,published:4}[state.stage]??0);
      function progressPanel(){const stages=[['调研配置','明确目的、模块和目标团队'],['AI 生成问卷','结合产品资料生成候选题目'],['人工审核','编辑题目并检查表达'],['模拟发布','展示飞书链接与通知'],['答卷分析','查看构造演示数据']];const active=stepIndex(),pct=progress();return `<aside class="surface progress-panel"><div class="panel-title"><span>任务进度</span><span class="tabular">${pct}%</span></div><div class="panel-sub">问卷全流程</div><div class="progress-track" role="progressbar" aria-label="问卷任务进度" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${pct}%"></div></div><div class="step-list">${stages.map((s,i)=>`<div class="step ${i<active?'complete':''} ${i===active?'current':''}"><div class="step-mark">${i<active?'✓':i+1}</div><div><strong>${s[0]}</strong><span>${s[1]}</span></div></div>`).join('')}</div><div class="help-card"><strong>匿名调研保护</strong>仅按团队/岗位汇总。低样本量分组不展示，答卷不记录姓名或邮箱。</div><div class="phase-preview"><strong>阶段 B 规划</strong>后续增加问卷、访谈、群聊、AI 答疑、产品内反馈和测试记录的手动/表格导入；连接状态只做界面模拟。</div></aside>`}
      function baseHeader(title,desc,extra=''){return `<div class="page-head"><div><div class="eyebrow">小U AI 产品运营 · 原型演示</div><h1>${title}</h1><p>${desc}</p></div>${extra?`<div class="head-actions">${extra}</div>`:''}</div>`}
      
function assistantPage(){
  const progressView = progressPanel();
  let center = '';

  if(state.stage === 'config') {
    center = `
      <div class="message">
        <div class="msg-icon">✦</div>
        <div class="bubble">
          你好，我是小U问卷助手。告诉我想了解的功能和对象，
          我会先帮你整理调研配置，再生成可审核的问卷。
        </div>
      </div>

      <div class="message">
        <div class="msg-icon">✦</div>
        <div class="bubble">
          我已根据小U功能模块准备好问卷配置。
          团队与岗位仅用于匿名分组统计，问卷不会收集姓名。
        </div>
      </div>

      <section class="config-card">
        <div class="config-top">
          <div>
            <h2>配置本次调研</h2>
            <p>配置将作为 AI 生成问卷的上下文</p>
          </div>
          <span class="config-tag">草稿 · 可调整</span>
        </div>

        <div class="form-grid">
          <div class="field full">
            <label for="objective">调研目的</label>
            <input id="objective"
              value="${esc(state.objective)}"
              placeholder="例如：了解脚本生成的使用体验">
          </div>

          <div class="field">
            <label for="feature">小U功能模块</label>
            <select id="feature">
              ${optionList(featureOptions,state.feature)}
            </select>
          </div>

          <div class="field">
            <label for="team">目标功能团队</label>
            <select id="team">
              ${optionList(teamOptions,state.team)}
            </select>
          </div>

          <div class="field">
            <label for="role">目标岗位类别</label>
            <select id="role">
              ${optionList(roleOptions,state.role)}
            </select>
          </div>

          <div class="field">
            <label for="qcount">题目数量
              <span class="hint">· 发起人可调</span>
            </label>
            <input id="qcount" type="number"
              min="3" max="12" value="${state.length}">
          </div>

          <div class="field">
            <label>题型</label>
            <div class="check-row">
              ${['单选题','多选题','评分题','开放题'].map(t =>
                `<label class="check-pill">
                  <input type="checkbox" data-type="${t}"
                  ${state.types.includes(t)?'checked':''}>${t}
                </label>`
              ).join('')}
            </div>
          </div>

          <div class="field">
            <label for="ratio">开放题数量</label>
            <select id="ratio">
              ${optionList(
                ['1 道必做题','2 道多选题','3 道开放题'],
                state.openRatio
              )}
            </select>
          </div>

          <div class="field full">
            <label for="note">特殊要求（自然语言）</label>
            <textarea id="note"
              placeholder="说明希望重点了解的问题、语气或答题时间">${esc(state.note)}</textarea>
            <span class="hint">
              避免诱导性问题；不要输入真实用户姓名或敏感业务信息。
            </span>
          </div>
        </div>

        <div class="form-foot">
          <span class="privacy-note">
            ✓ 匿名答卷 · 团队/岗位分组 · 小样本隐藏
          </span>
          <button class="btn primary" data-action="generate">
            确认配置并生成问卷 →
          </button>
        </div>
      </section>
    `;
  }

  else if(state.stage === 'review') {
    center = `
      <div class="message">
        <div class="msg-icon">✦</div>
        <div class="bubble">
          问卷草稿已生成。请逐题检查表达、选项和调研目标是否匹配；
          你可以编辑、删除或重新生成题目。
        </div>
      </div>

      <div class="review-summary">
        <strong>调研目标：</strong>${esc(state.objective)}<br>
        <strong>目标人群：</strong>${esc(state.team)} · ${esc(state.role)}
       　 <strong>模块：</strong>${esc(state.feature)}
        <div class="source-cite">
          依据：小U产品功能说明与已确认的调研配置。
          当前题目为本地演示生成结果。
        </div>
      </div>

      <div class="section-head">
        <div>
          <h2>候选问卷题目</h2>
          <p>${state.questions.length} 道 · 可编辑 · 匿名回答</p>
        </div>
        <button class="btn" data-action="add-question">＋ 添加题目</button>
      </div>

      <div class="question-list">
        ${state.questions.map((q,i)=>questionCard(q,i)).join('')}
      </div>

      <div class="review-actions">
        <button class="btn" data-action="back-config">返回配置</button>
        <button class="btn" data-action="regenerate">重新生成</button>
        <button class="btn primary" data-action="to-preview">
          审核完成，预览问卷 →
        </button>
      </div>
    `;
  }

  else if(state.stage === 'preview') {
    center = `
      <div class="message">
        <div class="msg-icon">✦</div>
        <div class="bubble">
          请检查答卷人看到的问卷说明和题目。
          试卷已模拟发布至企业飞书，并生成答题链接与通知。正式环境需接入企业认证与消息推送接口。
        </div>
      </div>

      <div class="surface preview-form">
        <div class="anon-note">
          ◎ 匿名问卷 · 仅按团队/岗位做汇总 · 不收集姓名
        </div>

        <h2>${esc(state.feature)}使用体验调研</h2>

        <p class="intro">
          ${esc(state.objective)}。
          问卷约 ${Math.max(2,Math.round(state.questions.length*.45))}
          分钟完成。请根据近期使用体验作答；请勿填写姓名或其他个人信息。
        </p>

        ${state.questions.map((q,i)=>`
          <div class="preview-question">
            <h3>
              ${i+1}. ${esc(q.text)}
              ${q.required?'<span style="color:#b95d4f">*</span>':''}
            </h3>

            ${q.type==='开放题'
              ? `<textarea placeholder="请输入你的回答"
                   style="width:100%;min-height:70px;
                   border:1px solid #e5e1d8;border-radius:8px;padding:10px">
                 </textarea>`
              : q.type==='评分题'
                ? `<div class="preview-option">
                    ${[1,2,3,4,5].map(n=>`
                      <label><input type="radio" name="p${i}"> ${n}</label>
                    `).join('　')}
                  </div>`
                : q.options.map(o=>`
                    <label class="preview-option">
                      <input type="${q.type==='多选题'?'checkbox':'radio'}"
                        name="p${i}">
                      ${esc(o)}
                    </label>
                  `).join('')
            }
          </div>
        `).join('')}

        <div class="bottom-bar">
          <span class="privacy-note">
            演示预览 · 答案不会提交到真实系统
          </span>
          <button class="btn primary" data-action="simulate-publish">
            模拟发布到企业飞书 →
          </button>
        </div>
      </div>

      <div class="review-actions">
        <button class="btn" data-action="to-review">返回编辑</button>
      </div>
    `;
  }

  else {
    center = `
      <div class="message">
        <div class="msg-icon">✦</div>
        <div class="bubble">
          问卷已完成模拟发布。下面的看板使用构造演示数据展示分析方式，
          并非真实小U答卷。
        </div>
      </div>

      <div class="notice">
        问卷已模拟对接企业飞书，并生成答题链接与通知。
        正式环境需接入企业认证与消息推送接口。
      </div>

      <div class="section-head" style="margin-top:20px">
        <div>
          <h2>发布摘要</h2>
          <p>本次发布为本地原型模拟</p>
        </div>
        <button class="btn" data-action="open-publish">
          查看模拟链接与通知
        </button>
      </div>

      <div class="review-actions">
        <button class="btn" data-action="to-preview">查看问卷预览</button>
        <button class="btn primary" data-action="go-analytics">
          查看答卷分析 →
        </button>
      </div>
    `;
  }

  return `
    ${baseHeader(
      '小U问卷洞察助手',
      '从调研配置到问卷审核与数据分析，形成可复核的产品运营闭环。',
      '<span class="badge">阶段 A · 问卷闭环</span>'
    )}

    <div class="workspace">

      <section class="surface assistant">

        <div class="assistant-head">
          <div class="agent">
            <div class="agent-icon">✦</div>
            <div>
              <div class="agent-title">小U调研 Agent</div>
              <div class="agent-meta">● 在线 · 可检索产品知识</div>
            </div>
          </div>

          <div class="head-actions">
            <button class="btn" data-action="new-survey">
              ＋ 新建问卷
            </button>
          </div>
        </div>

        <!-- 中间内容：独立滚动 -->
        <div class="chat">
          ${center}
        </div>

        <!-- 底部输入框：独立于聊天内容 -->
        <div class="chat-footer">

          <div class="chat-compose">
            <input
              id="chatInput"
              placeholder="也可以补充调研要求，例如：重点了解脚本开头的吸引力……"
            >
            <button class="btn" data-action="send-note">发送</button>
          </div>

          <div class="suggestions">
            <button data-suggestion="重点关注生成内容的人设一致性">
              人设一致性
            </button>
            <button data-suggestion="了解用户最常进行的修改步骤">
              生成后修改
            </button>
            <button data-suggestion="希望问卷控制在 5 分钟内">
              控制答题时长
            </button>
          </div>

        </div>

      </section>

      ${progressView}

    </div>
  `;
}

      function questionCard(q,i){const editing=state.editing===i;return `<article class="question-card"><div class="question-head"><div class="question-labels"><span class="chip">${esc(q.type)}</span><span class="chip muted">${q.required?'必答':'选答'}</span><span class="chip muted">第 ${i+1} 题</span></div><button class="btn quiet" data-action="toggle-required" data-index="${i}">${q.required?'设为选答':'设为必答'}</button></div>${editing?`<textarea class="edit-area" data-edit-text="${i}">${esc(q.text)}</textarea>${q.options.length?`<textarea class="edit-area" data-edit-options="${i}" style="margin-top:7px;min-height:58px" placeholder="每行一个选项">${esc(q.options.join('\n'))}</textarea>`:''}<div class="question-foot"><small>修改后保存</small><div class="actions"><button class="btn" data-action="cancel-edit" data-index="${i}">取消</button><button class="btn primary" data-action="save-edit" data-index="${i}">保存</button></div></div>`:`<div class="question-title">${esc(q.text)}</div>${q.options.length?`<div class="options">${q.options.map(o=>`<div class="option"><span>○</span>${esc(o)}</div>`).join('')}</div>`:`<div class="option" style="color:#899197">开放文本回答</div>`}<div class="question-foot"><small>来源依据：${esc(q.source)}</small><div class="actions"><button class="btn" data-action="edit-question" data-index="${i}">编辑</button><button class="btn" data-action="regenerate-one" data-index="${i}">重生成</button><button class="btn danger" data-action="delete-question" data-index="${i}">删除</button></div></div>`}</article>`}

      ].slice(0,Math.max(3,Math.min(12,Number(state.length)||6))).map(q=>({...q}));}
      function readConfig(){state.objective=el('#objective')?.value.trim()||state.objective;state.feature=el('#feature')?.value||state.feature;state.team=el('#team')?.value||state.team;state.role=el('#role')?.value||state.role;state.length=Math.max(3,Math.min(12,Number(el('#qcount')?.value)||6));state.openRatio=el('#ratio')?.value||state.openRatio;state.note=el('#note')?.value||'';state.types=els('[data-type]').filter(x=>x.checked).map(x=>x.dataset.type)}
      function openModal(kind){state.modal=kind;let content='';if(kind==='publish')content=`<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="eyebrow">模拟对接 · 企业飞书</div><h2 id="modalTitle">问卷发布预览</h2><p>以下链接和通知仅供交互演示，不会真实创建飞书表单或发送消息。</p><div class="field"><label>演示答题链接</label><input readonly value="https://feishu.example/s/xiaou-demo-2026"></div><div class="field"><label>通知预览</label><textarea readonly>【小U功能体验调研】邀请你匿名填写「${esc(state.feature)}」使用体验问卷。预计 3 分钟完成，仅按团队/岗位汇总。https://feishu.example/s/xiaou-demo-2026</textarea></div><div class="notice">问卷已模拟对接企业飞书，并生成答题链接与通知。正式环境需接入企业认证与消息推送接口。</div><div class="modal-actions"><button class="btn" data-action="copy-demo">复制演示链接</button><button class="btn primary" data-action="confirm-publish">完成发布</button></div></section></div>`;el('#modalRoot').innerHTML=content;}
      function closeModal(){state.modal=null;el('#modalRoot').innerHTML=''}
      function clickAction(action,index){switch(action){case'generate':readConfig();state.questions=templateQuestions();state.stage='review';state.confirmed=false;render();break;case'back-config':state.stage='config';render();break;case'to-preview':state.stage='preview';state.confirmed=true;render();break;case'to-review':state.stage='review';render();break;case'simulate-publish':openModal('publish');break;case'confirm-publish':state.published=true;state.stage='published';closeModal();render();toast('模拟发布完成 · 未连接真实飞书');break;case'copy-demo':{const link='https://feishu.example/s/xiaou-demo-2026';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(link).then(()=>toast('演示链接已复制')).catch(()=>toast('演示链接：'+link));else toast('演示链接：'+link);break}case'open-publish':openModal('publish');break;case'go-analytics':state.page='analytics';render();break;case'new-survey':state.page='assistant';state.stage='config';state.questions=[];state.published=false;render();break;case'continue-survey':state.page='assistant';state.stage=state.questions.length?'review':'config';render();break;case'add-question':state.questions.push({type:'开放题',text:'请补充你希望小U改进的方面。',options:[],required:false,source:'发起人添加'});render();break;case'edit-question':state.editing=index;render();break;case'cancel-edit':state.editing=null;render();break;case'save-edit':{const t=el(`[data-edit-text="${index}"]`)?.value.trim();if(t)state.questions[index].text=t;const o=el(`[data-edit-options="${index}"]`);if(o)state.questions[index].options=o.value.split('\n').map(x=>x.trim()).filter(Boolean);state.editing=null;render();toast('题目已保存');break}case'delete-question':state.questions.splice(index,1);render();toast('题目已删除');break;case'toggle-required':state.questions[index].required=!state.questions[index].required;render();break;case'regenerate-one':{const q=state.questions[index];q.text=q.type==='开放题'?'请描述最近一次使用时遇到的困难或希望改进的地方。':`在「${state.feature}」的使用过程中，哪方面最值得优先优化？`;q.source='重新生成 · 调研目标';render();toast('已生成新的题目表达');break}case'regenerate':state.questions=templateQuestions();render();toast('候选题目已重新生成');break;case'export-summary':exportSummary();break;case'mock-connect':openConnectModal();break;case'close-modal':closeModal();break;case'send-note':sendNote();break;case'toast-coming':toast('该问卷为列表演示项');break}}
      function openConnectModal(){el('#modalRoot').innerHTML=`<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="connectTitle"><div class="eyebrow">阶段 B · 渠道接入</div><h2 id="connectTitle">模拟企业渠道连接</h2><p>原型只展示连接后的状态，不读取公司群聊或答疑系统的数据。</p><div class="notice">正式环境需接入企业认证与消息推送接口。</div><div class="modal-actions"><button class="btn" data-action="close-modal">关闭</button><button class="btn primary" data-action="close-modal">知道了</button></div></section></div>`}
      function sendNote(){const inp=el('#chatInput');if(!inp||!inp.value.trim())return;state.note=(state.note?state.note+' ':'')+inp.value.trim();inp.value='';render();toast('调研要求已加入配置')}
      function exportSummary(){const text=`小U问卷分析摘要（构造演示数据）\n调研模块：${state.feature}\n目标团队：${state.team}\n目标岗位：${state.role}\n构造答卷：42 份\n高频示例主题：脚本开头吸引力、人设表达一致性、生成后修改路径\n说明：本摘要为交互原型使用的构造数据，不代表真实用户结论。`;const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='小U问卷分析摘要-构造演示.txt';a.click();URL.revokeObjectURL(a.href);toast('摘要已导出')}
      document.addEventListener('click',e=>{if(e.target.closest('[data-kb-save]')){document.querySelectorAll('[data-kb-f]').forEach(i=>{kbDocs[kbSel].meta[i.dataset.kbF]=i.value.trim()||'待补充'});render();toast('元数据已保存');return}const s=e.target.closest('[data-kb-sel]');
      document.addEventListener('change',e=>{if(e.target.id==='feature')state.feature=e.target.value;if(e.target.id==='team')state.team=e.target.value;if(e.target.id==='role')state.role=e.target.value;if(e.target.id==='ratio')state.openRatio=e.target.value});
      document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatInput'){e.preventDefault();sendNote()}if(e.key==='Escape')closeModal()});
      render();
    })();
  </script>
</body>
</html>
